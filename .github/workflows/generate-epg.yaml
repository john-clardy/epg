name: Generate EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check EPG site configuration
        env:
          EPG_SITES: ${{ vars.EPG_SITES }}
        run: |
          if [ -z "$EPG_SITES" ]; then
            echo "::error::EPG_SITES is not configured."
            echo "::error::Add it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

          echo "Configured sites: $EPG_SITES"

      - name: Prepare EPG directory
        run: |
          rm -rf public/epg
          mkdir -p public/epg

      - name: Generate EPG
        env:
          EPG_SITES: ${{ vars.EPG_SITES }}
        run: |
          npm run grab -- \
            --sites="$EPG_SITES" \
            --output="public/epg/{site}.xml" \
            --gzip \
            --maxConnections=3

      - name: Verify generated files
        run: |
          echo "Generated files:"

          find public/epg \
            -maxdepth 1 \
            -type f \
            -printf "%f - %s bytes\n" \
            | sort

          if ! find public/epg -maxdepth 1 -type f -name "*.xml*" | grep -q .; then
            echo "::error::No EPG files were generated."
            exit 1
          fi

      - name: Commit EPG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/epg

          if git diff --cached --quiet; then
            echo "No EPG changes to commit."
          else
            git commit -m "Update generated EPG"
            git pull --rebase origin master
            git push origin HEAD:master
          fi

      - name: Upload EPG artifact
        uses: actions/upload-artifact@v4
        with:
          name: epg-${{ github.run_number }}
          path: public/epg/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
