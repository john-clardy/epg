name: Generate EPG US

on:
  workflow_dispatch:

  schedule:
    # Every day at 06:00 UTC
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # ==========================================================
      # SETUP
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ==========================================================
      # DOWNLOAD CURRENT IPTV-ORG US PLAYLIST
      # ==========================================================

      - name: Download US playlist
        run: |
          mkdir -p temp

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            "https://iptv-org.github.io/iptv/countries/us.m3u" \
            --output temp/us.m3u

          echo "Downloaded US playlist:"
          ls -lh temp/us.m3u

      # ==========================================================
      # BUILD CUSTOM CHANNEL LIST
      # ==========================================================

      - name: Build custom US EPG channel list
        shell: bash
        run: |
          python3 <<'PY'
          import re
          import copy
          import glob
          import xml.etree.ElementTree as ET
          from pathlib import Path

          PLAYLIST = Path("temp/us.m3u")
          OUTPUT = Path("temp/us.channels.xml")
          UNMATCHED = Path("temp/us.unmatched.txt")
          REPORT = Path("temp/us.match-report.txt")

          # ------------------------------------------------------
          # Read tvg-id values from US playlist
          # ------------------------------------------------------

          playlist_ids = set()

          with PLAYLIST.open(
              "r",
              encoding="utf-8",
              errors="ignore"
          ) as f:

              for line in f:

                  if not line.startswith("#EXTINF"):
                      continue

                  match = re.search(
                      r'tvg-id="([^"]*)"',
                      line
                  )

                  if not match:
                      continue

                  tvg_id = match.group(1).strip()

                  if tvg_id:
                      playlist_ids.add(tvg_id)

          print(
              f"Playlist contains "
              f"{len(playlist_ids)} unique tvg-id values"
          )

          if not playlist_ids:
              raise SystemExit(
                  "ERROR: No tvg-id values found."
              )

          # ------------------------------------------------------
          # Find every channels XML in the repository
          # ------------------------------------------------------

          all_files = [
              Path(p)
              for p in glob.glob(
                  "sites/**/*.channels.xml",
                  recursive=True
              )
          ]

          print(
              f"Found {len(all_files)} channel-list files"
          )

          # ------------------------------------------------------
          # Priority ranking
          #
          # Lower number = preferred source
          # ------------------------------------------------------

          preferred_sites = {
              "tvpassport.com": 10,
              "zap2it.com": 20,
              "tvguide.com": 30,
              "tvinsider.com": 40,
              "directv.com": 50,
              "ontvtonight.com": 60,
              "pluto.tv": 70,
              "xumo.tv": 80,
              "plex.tv": 90,
              "distro.tv": 100,
              "streamingtvguides.com": 110,
              "epgshare01.online": 120,
              "i.mjh.nz": 130,
          }

          BLACKLISTED_SITES = {
              "tvtv.us",
              "tvprofil.com",
          }

          def site_from_path(path):

              parts = path.parts

              if len(parts) >= 2:
                  return parts[1]

              return ""

          def is_us_file(path):

              name = path.name.lower()

              patterns = [
                  "_us.",
                  "_us-",
                  "_us_",
                  "_usa.",
                  "_usa-",
                  "_usa_",
                  "us1.",
                  "us_",
                  "us-locals",
                  "us_locals",
                  "us-sports",
                  "us_sports",
              ]

              return any(
                  pattern in name
                  for pattern in patterns
              )

          def priority(path):

              site = site_from_path(path)

              # ----------------------------------------------
              # Explicitly preferred US providers
              # ----------------------------------------------

              base = preferred_sites.get(
                  site,
                  1000
              )

              # ----------------------------------------------
              # Give US-specific files a major preference
              # ----------------------------------------------

              if is_us_file(path):
                  base -= 500

              return (
                  base,
                  str(path)
              )

          all_files.sort(
              key=priority
          )

          # ------------------------------------------------------
          # Match channels
          # ------------------------------------------------------

          matched = {}
          provider_stats = {}
          file_stats = {}

          for path in all_files:

              site = site_from_path(path)

              if site in BLACKLISTED_SITES:
                print(f"Skipping broken site: {site}")
                continue

              try:
                  tree = ET.parse(path)

              except Exception as error:

                  print(
                      f"WARNING: Could not parse "
                      f"{path}: {error}"
                  )

                  continue

              root = tree.getroot()

              added = 0

              for channel in root.findall("channel"):

                  xmltv_id = (
                      channel.get("xmltv_id") or ""
                  ).strip()

                  if not xmltv_id:
                      continue

                  # Not present in our US playlist
                  if xmltv_id not in playlist_ids:
                      continue

                  # Already found from a higher-priority source
                  if xmltv_id in matched:
                      continue

                  matched[xmltv_id] = (
                      site,
                      path,
                      copy.deepcopy(channel)
                  )

                  added += 1

                  provider_stats[site] = (
                      provider_stats.get(site, 0) + 1
                  )

              if added:
                  file_stats[str(path)] = added

          # ------------------------------------------------------
          # Unmatched playlist channels
          # ------------------------------------------------------

          unmatched = sorted(
              playlist_ids - set(matched.keys())
          )

          # ------------------------------------------------------
          # Create one combined custom channels XML
          # ------------------------------------------------------

          output_root = ET.Element(
              "channels"
          )

          for xmltv_id in sorted(matched):

              site, path, channel = matched[
                  xmltv_id
              ]

              output_root.append(
                  channel
              )

          ET.indent(
              output_root,
              space="  "
          )

          tree = ET.ElementTree(
              output_root
          )

          with OUTPUT.open("wb") as f:

              f.write(
                  b'<?xml version="1.0" '
                  b'encoding="UTF-8"?>\n'
              )

              tree.write(
                  f,
                  encoding="utf-8",
                  xml_declaration=False
              )

              f.write(b"\n")

          # ------------------------------------------------------
          # Write unmatched IDs
          # ------------------------------------------------------

          UNMATCHED.write_text(
              "\n".join(unmatched) + "\n",
              encoding="utf-8"
          )

          # ------------------------------------------------------
          # Build report
          # ------------------------------------------------------

          report = []

          report.append(
              f"Playlist channels: {len(playlist_ids)}"
          )

          report.append(
              f"Matched channels: {len(matched)}"
          )

          report.append(
              f"Unmatched channels: {len(unmatched)}"
          )

          report.append("")
          report.append("Channels by EPG source:")
          report.append("")

          for site, count in sorted(
              provider_stats.items(),
              key=lambda x: x[1],
              reverse=True
          ):

              report.append(
                  f"{site}: {count}"
              )

          report.append("")
          report.append(
              "Channel-list files actually used:"
          )

          report.append("")

          for path, count in sorted(
              file_stats.items(),
              key=lambda x: x[1],
              reverse=True
          ):

              report.append(
                  f"{count:5}  {path}"
              )

          REPORT.write_text(
              "\n".join(report) + "\n",
              encoding="utf-8"
          )

          print()
          print("=" * 70)
          print("US EPG MATCH REPORT")
          print("=" * 70)

          for line in report:
              print(line)

          print("=" * 70)

          if not matched:
              raise SystemExit(
                  "ERROR: No EPG channels matched."
              )

          PY

      # ==========================================================
      # SHOW MATCH RESULTS
      # ==========================================================

      - name: Show match report
        run: |
          echo
          cat temp/us.match-report.txt
          echo

          echo "First 50 unmatched channels:"
          echo "--------------------------------"

          head -50 temp/us.unmatched.txt || true

      # ==========================================================
      # VALIDATE CUSTOM CHANNEL FILE
      # ==========================================================

      - name: Validate custom channel file
        run: |
          echo "Channels that will be grabbed:"

          grep -c \
            "<channel " \
            temp/us.channels.xml

          echo
          echo "Source breakdown:"

          grep -o \
            'site="[^"]*"' \
            temp/us.channels.xml \
            | sort \
            | uniq -c \
            | sort -nr

      # ==========================================================
      # PREPARE OUTPUT
      # ==========================================================

      - name: Prepare EPG directory
        run: |
          mkdir -p public/epg

          rm -f \
            public/epg/us.xml \
            public/epg/us.xml.gz

      # ==========================================================
      # GENERATE ONE COMBINED US GUIDE
      # ==========================================================

      - name: Generate US EPG
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          time npm run grab -- \
            --channels="temp/us.channels.xml" \
            --output="public/epg/us.xml" \
            --gzip \
            --days=3 \
            --maxConnections=3

      # ==========================================================
      # VERIFY GUIDE
      # ==========================================================

      - name: Verify generated guide
        run: |
          echo
          echo "Generated EPG:"
          echo "--------------------------------"

          ls -lh \
            public/epg/us.xml \
            public/epg/us.xml.gz

          if [ ! -s "public/epg/us.xml" ]; then

            echo \
              "::error::public/epg/us.xml was not generated."

            exit 1

          fi

          if [ ! -s "public/epg/us.xml.gz" ]; then

            echo \
              "::error::public/epg/us.xml.gz was not generated."

            exit 1

          fi

          echo
          echo "Programme count:"
          grep -c \
            "<programme " \
            public/epg/us.xml \
            || true

          echo
          echo "Channel count:"
          grep -c \
            "<channel " \
            public/epg/us.xml \
            || true

      # ==========================================================
      # UPLOAD DIAGNOSTIC REPORT
      # ==========================================================

      - name: Upload match report
        uses: actions/upload-artifact@v4
        with:
          name: us-epg-report-${{ github.run_number }}
          path: |
            temp/us.channels.xml
            temp/us.unmatched.txt
            temp/us.match-report.txt
          retention-days: 7

      # ==========================================================
      # COMMIT FINAL GUIDE
      # ==========================================================

      - name: Commit EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Working tree before commit:"
          git status --short

          git add \
            public/epg/us.xml \
            public/epg/us.xml.gz

          if git diff --cached --quiet; then
            echo "No EPG changes to commit."
          else
            git commit -m "Update US EPG"
            echo "Discarding unrelated working-tree changes..."
            git stash push --include-untracked -m "temporary workflow changes"
            echo "Working tree after stash:"
            git status --short
            git fetch origin master
            git rebase origin/master
            git push origin HEAD:master
          fi
